aid: forcepoint
name: Forcepoint
description: 'Forcepoint is a data-first cybersecurity vendor whose platform spans Data Loss Prevention (DLP), Security Service Edge / SASE (Forcepoint
  ONE and Data Security Cloud | SSE), Next-Generation Firewall (NGFW), and web, email, and data security. For developers and security engineers
  Forcepoint exposes several product REST APIs — DLP policy management, SSE Config/Log/IP and SCIM 2.0 provisioning, the NGFW Security Management
  Center (SMC) API, and an Appliance management API — documented on help.forcepoint.com. Auth varies by product: OAuth 2.0 bearer tokens for SSE,
  API-key clients for the NGFW SMC, and basic/session auth for DLP and appliances. Forcepoint publishes official automation tooling including
  the fp-NGFW-SMC-python SDK (PyPI), Ansible modules, and a Terraform provider, and runs a public status portal and trust center (SOC 2, ISO 27001/27017/27018,
  CSA STAR, FIPS 140, GDPR).'
